services:
  agent-secret-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8311:8311"
    environment:
      AGENT_SECRET_SERVICE_TOKEN: "${AGENT_SECRET_SERVICE_TOKEN:?set in .env}"
      AGENT_SECRET_SERVICE_PORT: "8311"
      AGENT_SECRET_DOPPLER_TOKEN: "${AGENT_SECRET_DOPPLER_TOKEN:?set in .env}"
    restart: unless-stopped
